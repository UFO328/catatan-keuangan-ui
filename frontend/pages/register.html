<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/app.css"><title>Daftar · Catatan Keuangan</title></head><body>
<div class=auth><main class=auth-box><h1>Buat akun</h1><p class=text-muted>Isi data berikut untuk mulai mencatat.</p><form id=form novalidate><div class='alert alert-danger d-none' role=alert data-form-error></div><div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" type="text" autocomplete="username" required><div class="invalid-feedback"></div></div><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required><div class="invalid-feedback"></div></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required><div class="invalid-feedback"></div></div><button class='btn btn-primary w-100' type=submit>Daftar</button></form><p class='mt-3 mb-0 small'>Sudah punya akun? <a href=login.html>Masuk</a></p></main></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="../js/pages/register.js"></script></body></html>
