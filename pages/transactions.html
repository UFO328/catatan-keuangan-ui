<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/app.css"><title>Transaksi · Catatan Keuangan</title></head><body>
<div id=page>
<div class='d-flex flex-column flex-sm-row justify-content-between gap-2 mb-3'><h2 class=section>Daftar transaksi</h2><button class='btn btn-primary btn-full-sm' id=add>Tambah transaksi</button></div>
<form id=filters class='panel row g-2 mb-3'>
<div class='col-6 col-md-3'><label class='form-label small' for=f-type>Tipe</label><select class=form-select id=f-type name=type><option value=''>Semua</option><option value=INCOME>Pemasukan</option><option value=EXPENSE>Pengeluaran</option></select></div>
<div class='col-6 col-md-3'><label class='form-label small' for=f-category>Kategori</label><select class=form-select id=f-category name=category><option value=''>Semua</option></select></div>
<div class='col-6 col-md-2'><label class='form-label small' for=f-from>Dari</label><input class=form-control type=date id=f-from name=date_from></div>
<div class='col-6 col-md-2'><label class='form-label small' for=f-to>Sampai</label><input class=form-control type=date id=f-to name=date_to></div>
<div class='col-12 col-md-2 d-flex align-items-end gap-2'><button class='btn btn-primary flex-fill' type=submit>Terapkan</button><button class='btn btn-outline-secondary' type=reset>Reset</button></div></form>
<div id=list></div><nav id=pager class=mt-3 aria-label='Halaman transaksi'></nav>
<div class='modal fade' id=modal tabindex=-1 aria-labelledby=modal-title><div class='modal-dialog modal-dialog-centered modal-fullscreen-sm-down'><form class=modal-content id=form novalidate>
<div class=modal-header><h2 class='modal-title fs-5' id=modal-title>Tambah transaksi</h2><button type=button class=btn-close data-bs-dismiss=modal aria-label=Tutup></button></div>
<div class=modal-body><div class='alert alert-danger d-none' role=alert data-form-error></div>
<div class=mb-3><label class=form-label for=type>Tipe</label><select class=form-select id=type name=type required><option value=EXPENSE>Pengeluaran</option><option value=INCOME>Pemasukan</option></select><div class=invalid-feedback></div></div>
<div class=mb-3><label class=form-label for=amount>Nominal (Rp)</label><input class=form-control id=amount name=amount inputmode=numeric autocomplete=off required><div class=invalid-feedback></div></div>
<div class=mb-3><label class=form-label for=category>Kategori</label><select class=form-select id=category name=category required></select><div class=invalid-feedback></div></div>
<div class=mb-3><label class=form-label for=transaction_date>Tanggal transaksi</label><input class=form-control type=datetime-local id=transaction_date name=transaction_date required><div class=invalid-feedback></div></div>
<div class=mb-0><label class=form-label for=description>Deskripsi</label><textarea class=form-control id=description name=description rows=2></textarea><div class=invalid-feedback></div></div></div>
<div class=modal-footer><button type=button class='btn btn-outline-secondary' data-bs-dismiss=modal>Batal</button><button class='btn btn-primary' type=submit>Simpan</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="../js/pages/transactions.js"></script></body></html>
