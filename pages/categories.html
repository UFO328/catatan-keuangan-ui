<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/app.css"><title>Kategori · Catatan Keuangan</title></head><body>
<div id=page>
<div class='d-flex flex-column flex-sm-row justify-content-between gap-2 mb-3'><h2 class=section>Daftar kategori</h2><button class='btn btn-primary btn-full-sm' id=add>Tambah kategori</button></div>
<div id=list></div><nav id=pager class=mt-3 aria-label='Halaman kategori'></nav>
<div class='modal fade' id=modal tabindex=-1 aria-labelledby=modal-title><div class='modal-dialog modal-dialog-centered'><form class=modal-content id=form novalidate>
<div class=modal-header><h2 class='modal-title fs-5' id=modal-title>Tambah kategori</h2><button type=button class=btn-close data-bs-dismiss=modal aria-label=Tutup></button></div>
<div class=modal-body><div class='alert alert-danger d-none' role=alert data-form-error></div>
<div class=mb-3><label class=form-label for=name>Nama kategori</label><input class=form-control id=name name=name maxlength=100 required><div class=invalid-feedback></div></div>
<div class=form-check><input class=form-check-input type=checkbox id=is_default name=is_default><label class=form-check-label for=is_default>Jadikan kategori default</label></div></div>
<div class=modal-footer><button type=button class='btn btn-outline-secondary' data-bs-dismiss=modal>Batal</button><button class='btn btn-primary' type=submit>Simpan</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="../js/pages/categories.js"></script></body></html>
